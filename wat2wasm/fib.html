<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Fibonacci</title>
    <script src="utils.js"></script>
  </head>
  <body>
		<p>Go back to <a href="../../index.html#webasm"> The Main page.</a></p>
    <div id="container"></div>
    <div class="container">
      <h1>Memory</h1>
      <div>Your memory instance is <span id="mem"></span> bytes.</div>
      <div>It has this many pages: <span id="pages"></span>.</div>
      <div>Uint32Buffer[11] = <span id="firstint"></span>.</div>
      <div>Uint8Buffer[44-48] = <span id="firstbytes"></span>.</div>
    </div>

    <button id="expand">Expand</button>

    <script>
      var memory = new WebAssembly.Memory({initial:2, maximum:10});

      var importObject = {
        js: { mem: memory }
      };

      function showDetails(mem) {
        var buf = mem.buffer;
        var memEl = document.getElementById('mem');
        var pagesEl = document.getElementById('pages');
        var firstIntEl = document.getElementById('firstint');
        var firstBytesEl = document.getElementById('firstbytes');

        memEl.innerText=buf.byteLength;
        pagesEl.innerText=buf.byteLength / 65536;

        var i32 = new Uint32Array(buf);
        var u8 = new Uint8Array(buf);

        firstIntEl.innerText=i32[11];
        firstBytesEl.innerText= "[" + u8[44] + "," + u8[45] + "," +
                                      u8[46] + "," + u8[47] + "]";
      };  
      fetchAndInstantiate('fib.wasm', importObject).then(function(instance) {
        var fibNum = 25;
        instance.exports.fibonacci(fibNum);
        var i32 = new Uint32Array(memory.buffer);

        var container = document.getElementById('container');

        for(var i = 0; i < fibNum; i++) {
            container.innerText += `Fib[${i}]: ${i32[i]}\n`;
        }
        var button = document.getElementById("expand");
      button.onclick = function() {
        try {
          mem.grow(1);
          showDetails(mem);
        } catch(re) {
          alert("You cannot grow the Memory any more!");
        };
      };
      //var mem = importObject.js.exports.memory;
      //var mem = instance.exports.memory;
      var mem = memory;
      showDetails(mem);
      });
      wasmInfo('fib.wasm');
    </script>
  </body>
</html>
