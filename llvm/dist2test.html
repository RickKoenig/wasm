<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Test clang</title>
    <script src="utils.js"></script>
  </head>
  <body>
		<p>Go back to <a href="../../index.html#webasm"> The Main page.</a></p>
    <div class="container">
      <h2>Test clang</h2>
      <div class="container" style="width:  80%">
        <span id = "xval">xval = foo</span>
        <br>
        <input type="range" id="xvalSlider" name="xval"/>
        <br>
        <br>

        <span id = "yval">yval = bar</span>
        <br>

        <input type="range" id="yvalSlider" name="yval"/>
        <br><br>
        
        <div>Result: <span id="result"/></div>
      </div>    
    </div>

    <script>
      var Xslider = document.getElementById("xvalSlider");
      var Xval = document.getElementById("xval");
      var Yslider = document.getElementById("yvalSlider");
      var Yval = document.getElementById("yval");
      var result = document.getElementById("result");

      fetchAndInstantiate2('dist2.wasm').then(
        function(instance) {
          Xslider.setAttribute("min", -10);
    	    Xslider.setAttribute("max", 10);
          Xslider.setAttribute("step", .25);
          Xslider.value = 5;
          Yslider.setAttribute("min", -20);
    	    Yslider.setAttribute("max", 20);
          Yslider.setAttribute("step", .25);
          Yslider.value = 12;

	        var updateLabels = function(xval, yval, dist2) {
            Xval.innerText = "xval: " + xval;
            Yval.innerText = "yval: " + yval;
            result.innerText = dist2;
          };

          var listener = function() {
              var dist2 = instance.exports.dist2(Xslider.value, Yslider.value);
              updateLabels(Xslider.value, Yslider.value, dist2);
          };

      	  Xslider.onchange = listener;
	        Xslider.oninput = listener;
      	  Yslider.onchange = listener;
	        Yslider.oninput = listener;
          listener();
        }
      ); 
      wasmInfo('dist2.wasm');
    </script>
  </body>
</html>
